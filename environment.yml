# Ambiente conda do projeto. Da raiz do repositório:
#
#   conda env create -f environment.yml
#   conda activate trade
#
# Só canais públicos (conda-forge e PyPI), versões fixas nas que passaram nos
# testes, sem caminho local. O MetaTrader5 só existe para Windows; nos outros
# sistemas o ambiente sobe sem ele (pesquisa e backtest funcionam, execução não).
name: trade
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.14
  - pip
  - pip:
      - pandas==3.0.5
      - numpy==2.5.2
      - pyarrow==25.0.1
      - pyyaml==6.0.3
      - requests==2.34.2
      - scipy==1.18.1
      - yfinance==1.7.0
      - lightgbm==4.7.0
      - scikit-learn==1.9.0
      - pytest==9.1.1
      - matplotlib==3.11.1
      - MetaTrader5==5.0.6147; sys_platform == "win32"
      - -e .
