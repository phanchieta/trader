symbol: PETR4
yahoo_symbol: PETR4.SA
timezone: America/Sao_Paulo

data:
  dir: data
  daily_file: petr4_d1.parquet
  intraday_file: petr4_m1.parquet          # coletor MT5 (1m ao vivo, daqui pra frente)
  intraday_timeframe: M1
  yahoo_intraday_interval: 15m             # 1m~7d | 5m/15m/30m~60d | 1h~730d
  # arquivo derivado: data/petr4_yahoo_<interval>.parquet

mt5:
  # vazio = autodetecção; preencha se tiver mais de um terminal instalado
  terminal_path: ""
  # offset do horário do servidor da corretora vs UTC, em horas.
  # PENDENTE confirmar: comparar a 1a barra do dia com a abertura do pregão (10:00 BRT).
  server_utc_offset_hours: -3

costs:
  modalidade: swing              # swing | daytrade
  corretagem_por_ordem: 4.90     # XP, confirmado pela corretora em 2026-09-23: R$4,90
                                 # por ordem de ação no swing (day trade com RLP = 0;
                                 # mesmo custo em qualquer plataforma; MT5 é gratuito)
  emolumentos_pct_swing: 0.000325     # ~0,0325% — CONFERIR tabela vigente da B3
  emolumentos_pct_daytrade: 0.00005   # ~0,005%  — CONFERIR
  iss_sobre_corretagem: 0.0
  slippage_ticks: 1.0
  tick_size: 0.01

taxes:
  # IR é mensal sobre resultado líquido — entra como ajuste no relatório, não por trade.
  # Confirme tudo com um contador.
  ir_swing: 0.15
  ir_daytrade: 0.20
  irrf_swing_sobre_venda: 0.00005     # informativo (antecipação, não custo extra)
  irrf_daytrade_sobre_lucro: 0.01

backtest:
  initial_equity: 100000.0
  lot_size: 100

basket:
  # 5 ações de alto volume da B3. Yahoo: <symbol>.SA
  symbols: [PETR4, VALE3, ITUB4, BBDC4, ABEV3]
  yahoo_suffix: .SA

universe:
  # universo maior para o momentum cross-sectional (rankear entre nomes)
  symbols: [PETR4, PETR3, VALE3, ITUB4, ITSA4, BBDC4, BBAS3, ABEV3, WEGE3, LREN3,
            RADL3, GGBR4, GOAU4, CSNA3, USIM5, ELET3, CMIG4, CPLE6, UGPA3, VIVT3,
            EMBR3, JBSS3, CCRO3, TOTS3]

factor_universe:
  # ~110 nomes líquidos da B3 para o modelo de fatores (rankear entre eles).
  symbols: [PETR4, PETR3, VALE3, ITUB4, ITSA4, BBDC4, BBDC3, BBAS3, B3SA3, ABEV3,
            WEGE3, RENN3, LREN3, MGLU3, RADL3, RAIL3, SUZB3, GGBR4, GOAU4, CSNA3,
            USIM5, CMIG4, CPLE6, ELET3, ELET6, EQTL3, EGIE3, TAEE11, CPFE3, SBSP3,
            UGPA3, VBBR3, PRIO3, CSAN3, BRAP4, KLBN11, EMBR3, POMO4, RAPT4, TUPY3,
            LEVE3, KEPL3, ROMI3, JBSS3, MRFG3, BRFS3, BEEF3, SLCE3, SMTO3, CAML3,
            AGRO3, MDIA3, ABCB4, BPAC11, BRSR6, SANB11, PSSA3, BBSE3, IRBR3, CIEL3,
            ASAI3, CRFB3, PCAR3, GUAR3, ALPA4, CVCB3, MOVI3, RENT3, ECOR3, CCRO3,
            AZUL4, GOLL4, TOTS3, LWSA3, POSI3, TIMS3, VIVT3, OIBR3, CYRE3, MRVE3,
            EZTC3, EVEN3, GFSA3, JHSF3, DIRR3, MULT3, ALSO3, LOGG3, HYPE3, FLRY3,
            RDOR3, HAPV3, DASA3, QUAL3, ODPV3, PNVL3, ENEV3, AURE3, STBP3, LOGN3,
            HBSA3, TEND3, GGPS3, PORT3, MYPK3, FRAS3, SHUL4, EALT4, RANI3, DTEX3,
            SIMH3, VAMO3, PETZ3, VULC3, CEAB3, VIVA3, ARZZ3, SOMA3, CASH3, IFCM3]

risk:
  risco_por_trade_pct: 0.005
  perda_maxima_diaria_pct: 0.02

futures:
  ibov_proxy: "^BVSP"            # Yahoo — proxy do WIN
  usdbrl_proxy: "USDBRL=X"       # Yahoo — proxy do WDO
  cost_bps_stock: 8.0            # custo round-trip por giro de posição (bps)
  cost_bps_future: 3.0
  max_leverage: 2.0             # trend multi-ativo com futuro pode alavancar

risk_overlay:
  target_ann_vol: 0.15      # alvo de volatilidade anualizada da carteira
  vol_lookback: 20          # barras para a vol realizada
  max_leverage: 1.0         # nunca alavanca; só corta exposição
  trailing_stop_pct: 0.10   # recuo do pico que protege o lucro (só arma no azul)
                            # varredura 8–20% todas batem "sem stop"; 10% = meio robusto
  rebalance_band: 0.15      # só ajusta a posição se o desvio do alvo passar disso.
                            # Com corretagem de R$4,90/ordem, derruba de ~560 para
                            # ~90 ordens/ano sem piorar o resultado (§24)

blend:
  champion_weight: 0.5      # fração do capital na sleeve campeão; o resto vai para fatores
  factor_quintile: 0.20     # top 20% do score de fatores (quintil)
  # sleeve de fatores rebalanceia por trimestre-calendário; vol-target diário

share_classes:
  # pares de classes da mesma empresa [A, B]; spread = log(A) - log(B)
  # ON x PN, ou unit x PN quando a unit é a classe líquida (um par por empresa)
  pairs:
    - [PETR3, PETR4]
    - [ITUB3, ITUB4]
    - [BBDC3, BBDC4]
    - [ITSA3, ITSA4]
    - [GGBR3, GGBR4]
    - [GOAU3, GOAU4]
    - [CMIG3, CMIG4]
    - [USIM3, USIM5]
    - [BRAP3, BRAP4]
    - [CPLE3, CPLE6]
    - [ELET3, ELET6]
    - [BRKM3, BRKM5]
    - [TAEE11, TAEE4]
    - [SAPR11, SAPR4]
    - [KLBN11, KLBN4]
    - [SANB11, SANB4]
    - [ENGI11, ENGI4]
    - [BPAC11, BPAC5]
    - [ALUP11, ALUP4]
    - [TRPL3, TRPL4]
    - [ISAE3, ISAE4]
    - [ALPA3, ALPA4]
    - [RAPT3, RAPT4]
    - [UNIP3, UNIP6]
    - [CESP3, CESP6]
    - [BRSR3, BRSR6]
    - [CLSC3, CLSC4]
    - [POMO3, POMO4]
    - [EUCA3, EUCA4]
    - [TASA3, TASA4]
    - [BEES3, BEES4]
    - [RANI3, RANI4]
    - [CGAS3, CGAS5]
    - [TIET3, TIET4]
    - [VIVT3, VIVT4]
    - [OIBR3, OIBR4]
    - [LAME3, LAME4]
    - [VALE3, VALE5]
  min_traded_value: 5000000   # R$/dia (mediana 60 pregões) nas DUAS pontas para operar o par
